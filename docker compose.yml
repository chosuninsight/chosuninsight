services:
  updater:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_updater
    command: >
      sh -c "rm -f /root/tmp/update_complete.flag && python Update_date.py"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./Update_date.py:/app/Update_date.py
      - ./chosun_rag_data:/app/chosun_rag_data
      - ./chroma_db_update:/root/chroma_db_update
      - tmp_sync:/root/tmp
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Seoul
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_backend
    entrypoint: >
      sh -c "
      echo '[/root/tmp] waiting for update flag...' &&
      until [ -f /root/tmp/update_complete.flag ]; do
        sleep 5;
      done &&
      echo 'update flag detected, starting backend' &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend:/app/backend
      - ./chroma_db_store:/app/chroma_db
      - ./chroma_db_update:/root/chroma_db_update
      - ./chosun_rag_data:/app/chosun_rag_data
      - tmp_sync:/root/tmp
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PERSIST_DIRECTORY: /app/chroma_db
      UPDATE_DB_DIRECTORY: /root/chroma_db_update
      TZ: Asia/Seoul
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:9000,http://127.0.0.1:9000,http://foxibu.is-a.dev:9000,http://localhost:9001,http://127.0.0.1:9001,http://foxibu.is-a.dev:9001,https://localhost:9000,https://127.0.0.1:9000,https://foxibu.is-a.dev:9000
    depends_on:
      - updater
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chosun_frontend
    ports:
      - "9001:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  tmp_sync:

networks:
  app-network:
    driver: bridge
