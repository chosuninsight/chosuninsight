services:
  updater:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_updater
    command: >
      sh -c "rm -f /root/tmp/update_complete.flag && python update_date.py; touch /root/tmp/update_complete.flag"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./update_date.py:/app/update_date.py
      - ./rag_pipeline.py:/app/rag_pipeline.py
      - ./rebuild_chroma.py:/app/rebuild_chroma.py
      - ./chosun_rag_data:/app/chosun_rag_data
      - ./chroma_db_update:/root/chroma_db_update
      - tmp_sync:/root/tmp
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Seoul
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_backend
    restart: unless-stopped
    command: >
      sh -c "echo 'Waiting for update_complete.flag...' && 
             while [ ! -f /root/tmp/update_complete.flag ]; do sleep 2; done && 
             echo 'Flag found! Starting backend...' && 
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ./rag_pipeline.py:/app/rag_pipeline.py
      - ./rebuild_chroma.py:/app/rebuild_chroma.py
      - ./chroma_db_store:/app/chroma_db
      - ./chroma_db_update:/root/chroma_db_update
      - ./chosun_rag_data:/app/chosun_rag_data
      - tmp_sync:/root/tmp
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PERSIST_DIRECTORY: /app/chroma_db
      UPDATE_DB_DIRECTORY: /root/chroma_db_update
      TZ: Asia/Seoul
    depends_on:
      updater:
        condition: service_started
    ports:
      - "127.0.0.1:8011:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_INTERNAL_API_KEY: ${VITE_INTERNAL_API_KEY}
    container_name: chosun_frontend
    ports:
      - "9001:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  tmp_sync:

networks:
  app-network:
    driver: bridge
