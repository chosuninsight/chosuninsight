version: '3.8'

services:
  updater:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_updater
    # ✅ 시작할 때 기존 플래그 파일이 있다면 삭제하고 스크립트 실행
    command: >
      sh -c "rm -f /root/tmp/update_complete.flag && python Update_date.py"
    volumes:
      - /etc/localtime:/etc/localtime:ro  # ✅ 호스트의 시간 설정을 읽기 전용으로 공유
      - ./Update_date.py:/app/Update_date.py
      - ./chosun_rag_data:/app/chosun_rag_data
      - ./chroma_db_update:/root/chroma_db_update
      - tmp_sync:/root/tmp # ✅ 전용 통로 연결
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul  # ✅ 한국 시간대로 설정
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: chosun_backend
    # ✅ 로그에서 '파이프라인 완료' 문구가 나올 때까지 5초 간격으로 체크 후 uvicorn 실행
    entrypoint: >
      sh -c "
      echo '🔍 [/root/tmp] 신호 대기 중...' &&
      until [ -f /root/tmp/update_complete.flag ]; do
        sleep 5
      done &&
      echo '✅ 신호 확인! 서버를 시작합니다.' &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend:/app/backend
      - ./chroma_db_store:/app/chroma_db
      - ./chroma_db_update:/root/chroma_db_update
      - ./chosun_rag_data:/app/chosun_rag_data
      - tmp_sync:/root/tmp # ✅ updater와 동일한 통로 연결
    
    ports:
      - "8000:8000"
    env_file: .env
    
    environment:
      - PYTHONUNBUFFERED=1
      - PERSIST_DIRECTORY=/app/chroma_db
      - UPDATE_DB_DIRECTORY=/root/chroma_db_update
      - TZ=Asia/Seoul  # ✅ 한국 시간대로 설정
    depends_on:
      - updater
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

volumes:
  tmp_sync: # ✅ 컨테이너끼리만 공유되는 가상 볼륨

networks:
  app-network:
    driver: bridge